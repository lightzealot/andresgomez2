[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/ia.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/recursos"
  to = "https://comunidad.andresgomez.store/recursos"
  status = 301
  force = true

[[redirects]]
  from = "/recursos/:slug"
  to = "https://comunidad.andresgomez.store/recursos/:slug"
  status = 301
  force = true

